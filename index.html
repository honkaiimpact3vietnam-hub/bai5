<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>STT</th>
            <th>Tên hàng hóa</th>
            <th>Số lượng có</th>
            <th>Số lượng mua</th>
            <th>Đơn giá</th>
            <th>Chọn mặt hàng</th>
        </tr>
        <tr>
            <td>1</td>
            <td>CPU</td>
            <td>14</td>
            <!-- Thêm oninput="tinhtien()" cho cả 3 dòng -->
            <td><input type="number" class="soluong" placeholder="0" disabled oninput="tinhtien()"></td>
            <td class="price">120</td>
            <td><input type="checkbox" class="choose" onchange="chophep()"></td>
        </tr>
        <tr>
            <td>2</td>
            <td>RAM</td>
            <td>6</td>
            <td><input type="number" class="soluong" placeholder="0" disabled oninput="tinhtien()"></td>
            <td class="price">70</td>
            <td><input type="checkbox" class="choose" onchange="chophep()"></td>
        </tr>
        <tr>
            <td>3</td>
            <td>HDD</td>
            <td>20</td>
            <td><input type="number" class="soluong" placeholder="0" disabled oninput="tinhtien()"></td>
            <td class="price">50</td>
            <td><input type="checkbox" class="choose" onchange="chophep()"></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="reset" onclick="nhapLai()">Nhập lại</button></td>
            <td></td>
            <td>Tổng cộng: <p id="sum">0</p></td>
            <td></td>
            <td><input type="checkbox" id="VAT" onchange="tinhtien()"> VAT</td>
        </tr>
    </table>

    <script>
        var tong = 0;
        function chophep() { 
            let checkbox = document.getElementsByClassName("choose");
            let oSoLuong = document.getElementsByClassName("soluong");

            for (let i = 0; i < checkbox.length; i++) {
                if (checkbox[i].checked == true) {
                    oSoLuong[i].disabled = false;
                } else {
                    oSoLuong[i].disabled = true;
                    oSoLuong[i].value = "";
                }
            }
            // Cập nhật lại tổng tiền mỗi khi tick hoặc bỏ tick
            tinhtien();
        }

        function tinhtien() {
            tong=0;
            var oSoluong = document.getElementsByClassName("soluong");
            var gia = document.getElementsByClassName("price");

            for (var i = 0; i < oSoluong.length; i++) {
                var sl = Number(oSoluong[i].value);
                var donGia = Number(gia[i].innerText);
                
                tong += sl * donGia;
            }
            var result = tong;
            var VATer=document.getElementById("VAT");
            if (VAT.checked) {
                result=tong*1.1;
                document.getElementById("sum").innerHTML = result;
            }
            else {
                document.getElementById("sum").innerHTML = tong;
            }

        }
        function nhapLai() {
            let checkbox = document.getElementsByClassName("choose");
            let oSoLuong = document.getElementsByClassName("soluong");

            // Bỏ tick toàn bộ mặt hàng, xóa số lượng và khóa lại ô nhập
            for (let i = 0; i < checkbox.length; i++) {
                checkbox[i].checked = false;
                oSoLuong[i].value = "";
                oSoLuong[i].disabled = true;
            }

            // Bỏ tick ô VAT
            document.getElementById("VAT").checked = false;

            // Đưa tổng tiền về 0
            document.getElementById("sum").innerHTML = 0;
        }
    </script>
</body>
</html>
